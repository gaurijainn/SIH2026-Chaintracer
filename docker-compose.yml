# One command: docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ps26183
      POSTGRES_PASSWORD: ps26183
      POSTGRES_DB: ps26183
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps26183"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/ps26183-neo4j
      NEO4J_PLUGINS: '["graph-data-science"]'
    volumes: [neo4jdata:/data]
    ports: ["7474:7474", "7687:7687"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ps26183-neo4j 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7
    ports: ["${REDIS_HOST_PORT:-6380}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ml:
    build: ./services/ml
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: Dockerfile.node }
    # apply pending migrations, then serve
    command: sh -c "pnpm --filter @ps26183/api db:migrate && pnpm --filter @ps26183/api start"
    env_file: .env
    environment:
      FIXTURES_DIR: /app/fixtures
    ports: ["4000:4000"]
    volumes: ["./fixtures:/app/fixtures"]
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      redis: { condition: service_healthy }
      ml: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  workers:
    build: { context: ., dockerfile: Dockerfile.node }
    command: pnpm --filter @ps26183/workers start
    env_file: .env
    environment:
      FIXTURES_DIR: /app/fixtures
    volumes: ["./fixtures:/app/fixtures"]
    depends_on:
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: Dockerfile.node }
    command: pnpm --filter @ps26183/web dev
    environment:
      API_PROXY: http://api:4000
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
  neo4jdata:
