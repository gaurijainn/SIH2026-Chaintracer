name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.5.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @ps26183/api db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: services/ml/requirements.txt }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ps26183, POSTGRES_PASSWORD: ps26183, POSTGRES_DB: ps26183 }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ps26183" --health-interval 5s --health-timeout 3s --health-retries 20
      neo4j:
        image: neo4j:5-community
        env: { NEO4J_AUTH: neo4j/ps26183-neo4j }
        ports: ['7687:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ps26183-neo4j 'RETURN 1'" --health-interval 10s --health-timeout 10s --health-retries 30 --health-start-period 30s
    env:
      DATABASE_URL: postgresql://ps26183:ps26183@localhost:5432/ps26183
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ps26183-neo4j
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.5.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @ps26183/api db:generate
      - run: pnpm --filter @ps26183/api db:validate
      - run: pnpm --filter @ps26183/api db:migrate
      - run: pnpm --filter @ps26183/api test:int
